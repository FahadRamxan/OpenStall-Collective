[project]
name = "openstall"
version = "0.1.0"
description = "Small WhatsApp sellers, selling to AI shopping agents, paid through PayPal."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "mcp>=2.3,<3",
    # Settings from the environment and .env (it brings python-dotenv).
    "pydantic-settings>=2.16,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    # Property tests for the allocator and trust passports.
    "hypothesis>=6.100,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# One installable project; each app and package keeps its own folder from the spec layout.
[tool.hatch.build.targets.wheel]
packages = [
    "apps/api/openstall_api",
    "packages/agents/openstall_agents",
    "packages/allocator/openstall_allocator",
    "packages/paypal/openstall_paypal",
    "packages/trust/openstall_trust",
]

[tool.pytest.ini_options]
testpaths = ["apps", "packages", "scripts"]
