[project]
name = "openstall"
version = "0.1.0"
description = "Small WhatsApp sellers, selling to AI shopping agents, paid through PayPal."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "mcp>=2.3,<3",
    # Settings from the environment and .env (it brings python-dotenv).
    "pydantic-settings>=2.16,<3",
    # Ed25519 signatures on trust passports (raw key bytes need 40 or later).
    "cryptography>=42",
    # The database: models and sessions, and migrations.
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    # Server-sent events for the live feed (the MCP SDK already depends on it).
    "sse-starlette>=3,<4",
    # HTTP for the PayPal client and Twilio media downloads.
    "httpx>=0.27,<1",
    # APIMatic's PayPal Python SDK, for PayPal Orders and Payments (packages/paypal/openstall_paypal/sdk.py). It is
    # not on PyPI, so it installs from its repository, pinned to the commit paypal-plan.md was checked against.
    "paypal @ git+https://github.com/context-plugins/paypal-python-sdk.git@143e57f2a3729d7df3727386b8c9ddf023d9a5df",
    # The SDK's HTTP library: our error boundary tells its connection failures apart.
    "httpx2>=2.13.1,<3",
    # Form posts: Twilio's webhook, and photos and voice notes sent from /seller-chat.
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
# The Postgres driver for the hosted demo (render.yaml installs it). Locally, SQLite needs nothing.
postgres = ["psycopg[binary]>=3.2,<4"]
dev = [
    "pytest>=8",
    # Property tests for the allocator and trust passports.
    "hypothesis>=6.100,<7",
    # Mocks PayPal and other HTTP services in tests, so no test calls a real API.
    "respx>=0.21,<1",
    # Reads render.yaml in its test.
    "pyyaml>=6,<7",
    # Type checks the PayPal package against the SDK, which ships py.typed: mypy --strict packages/paypal.
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# One installable project; each app and package keeps its own folder from the spec layout.
# The PayPal SDK is a direct (git) reference, which hatchling only accepts when this is on.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = [
    "apps/api/openstall_api",
    "packages/agents/openstall_agents",
    "packages/allocator/openstall_allocator",
    "packages/paypal/openstall_paypal",
    "packages/trust/openstall_trust",
]

[tool.pytest.ini_options]
testpaths = ["apps", "packages", "scripts"]
