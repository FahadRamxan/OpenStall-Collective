# Render blueprint for the hosted demo: the API, the web app and a Postgres database.
# Create it in the Render dashboard: New > Blueprint, pick this repo. Every push to main then deploys both services.
#
# Plans: the demo must stay up until judging ends on December 15. A free Render Postgres is deleted 30 days after it
# is created, and free web services sleep after 15 idle minutes and take about a minute to wake, which a judge would
# see. So both services run on Render's $7 instance type (0.5c-512mb, once called Starter) and the database on its $6
# one (0.1c-256mb, once basic-256mb): $20.25 a month with the disk, paid from the hackathon's $50 Render credit
# (docs/decisions.md, prompt 12).
#
# Secrets are marked "sync: false": Render asks for their values only when the blueprint is created (leave the ones
# you do not have yet empty, and add them later in each service's Environment tab), and they never live in git. The
# two secrets that belong to no outside account, the demo token and the passport signing key, Render generates.
# Every other value here is applied again on each blueprint sync, over any change made in the dashboard, so change
# them in this file. The URLs below assume Render gives the services these names; if it adds a suffix, change the
# three URL variables here to the real addresses.

databases:
  - name: openstall-db
    plan: 0.1c-256mb
    databaseName: openstall
    user: openstall
    postgresMajorVersion: "16"
    ipAllowList: [] # only the services in this blueprint can connect

services:
  - type: web
    name: openstall-collective-api
    runtime: python
    plan: 0.5c-512mb
    buildCommand: pip install -e ".[postgres]"
    # Migrate, seed the demo world only on a fresh database, then serve. One process: the rate limits' windows live
    # in memory.
    startCommand: >-
      alembic upgrade head &&
      python scripts/seed_demo.py --if-empty --demo-order &&
      uvicorn openstall_api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    # Seller photos and voice notes (MEDIA_DIR). A disk keeps them across deploys.
    disk:
      name: openstall-media
      mountPath: /var/data
      sizeGB: 1
    envVars:
      # The Python the tests run on (Render needs the full version).
      - key: PYTHON_VERSION
        value: "3.13.3"
      # The real PayPal sandbox and models. Without its keys the API still starts; /status says what is missing.
      - key: OPENSTALL_MODE
        value: sandbox
      - key: PUBLIC_BASE_URL
        value: https://openstall-collective-api.onrender.com
      - key: WEB_BASE_URL
        value: https://openstall-collective.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: openstall-db
          property: connectionString
      - key: AUTO_MIGRATE
        value: "false" # the start command migrates
      - key: MEDIA_DIR
        value: /var/data/media
      # Render's proxy adds the client's address to X-Forwarded-For: the limits read it there (limits.py).
      - key: PROXY_HOPS
        value: "1"
      - key: PAYMENT_PATH
        value: payouts
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      # The sandbox personal accounts that receive Priya's, Lucia's and Noor's payouts, listed with the other sandbox
      # accounts in docs/day-one-checks.md. They are written into the database when it is seeded.
      - key: PAYPAL_SANDBOX_PAYEE_PRIYA
        value: sb-e437yj53750314@personal.example.com
      - key: PAYPAL_SANDBOX_PAYEE_LUCIA
        value: sb-abthj53620158@personal.example.com
      - key: PAYPAL_SANDBOX_PAYEE_NOOR
        value: sb-oalci53802401@personal.example.com
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      # WhatsApp through Meta's WhatsApp Cloud API: its test number's access token and phone number id, and the app's
      # secret that signs its webhook. Render makes the verify token: type it into Meta's webhook settings.
      - key: WHATSAPP_PROVIDER
        value: meta
      - key: META_WHATSAPP_TOKEN
        sync: false
      - key: META_WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_WHATSAPP_VERIFY_TOKEN
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      # Unlocks /demo's Run and Reset controls in sandbox mode. Render makes a random one; read it in the API's
      # Environment tab, for the judges' testing instructions.
      - key: DEMO_RUN_TOKEN
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      # ElevenLabs: Scribe turns sellers' voice notes into text, and Eleven v4 Turbo speaks OpenStall's answers.
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: GOOGLE_VISION_API_KEY
        sync: false
      # Signs the trust passports: Render makes a random 32-byte key, base64, which is what an Ed25519 key is. It
      # must not change once passports are signed with it.
      - key: PASSPORT_SIGNING_KEY
        generateValue: true

  - type: web
    name: openstall-collective
    runtime: node
    plan: 0.5c-512mb
    rootDir: apps/web
    buildCommand: npm ci && npm run build
    startCommand: npm start -- --port $PORT
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Baked into the build: the address of the API above.
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://openstall-collective-api.onrender.com
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
