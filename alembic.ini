# Alembic command-line settings. The database URL comes from DATABASE_URL (see .env.example), not from this file.
# Make a migration after changing models.py:  alembic revision --autogenerate -m "what changed"
# Apply migrations:                           alembic upgrade head
# The API also applies them itself at start-up when AUTO_MIGRATE is on.

[alembic]
script_location = apps/api/openstall_api/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
